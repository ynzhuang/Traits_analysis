name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # The analysis core: schemas, services, decomposition, agreement metrics.
  # Hermetic — no model provider is contacted.
  # ---------------------------------------------------------------------
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Installing from requirements.txt is itself the check that matters
      # most here: the pins were previously absent, pip resolved a langchain
      # major the code cannot import, and nothing in the project would start.
      # A clean install has to produce a working tree.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Import check (catches dependency drift before any test runs)
        run: |
          python -c "import schemas, services"
          python -c "import decompose_criteria, analyze_criteria_decomposition_agreement"

      - name: Tests
        run: pytest tests/ -q

  # ---------------------------------------------------------------------
  # The Flask API the web UI reads from, exercised against the committed
  # sample data so a broken path fails here rather than in a browser.
  # ---------------------------------------------------------------------
  backend:
    name: Web UI backend (Flask)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        working-directory: webui/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke-test the API against sample data
        working-directory: webui/backend
        run: python ../../.github/scripts/smoke_backend.py

  # ---------------------------------------------------------------------
  # The Next.js UI. `next build` runs lint and typecheck as part of the build.
  # ---------------------------------------------------------------------
  frontend:
    name: Web UI frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webui/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webui/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
